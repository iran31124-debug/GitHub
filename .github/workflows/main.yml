name: Build Advanced APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Bimeh Iran Installments
    runs-on: ubuntu-latest

    steps:

      # -----------------------------
      # 1. دریافت پروژه
      # -----------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------
      # 2. Java 17
      # -----------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # -----------------------------
      # 3. Android SDK
      # -----------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # -----------------------------
      # 4. بررسی فایل پروژه
      # -----------------------------
      - name: Check project files
        run: |
          echo "===== Repository ====="
          pwd
          echo "===== Files ====="
          find . -maxdepth 4 -type f | sort | head -300

      # -----------------------------
      # 5. استخراج پروژه
      # -----------------------------
      - name: Extract project
        run: |
          rm -rf build_project
          mkdir -p build_project

          if [ ! -f "BimehIranInstallments.zip" ]; then
            echo "ERROR: BimehIranInstallments.zip not found"
            exit 1
          fi

          unzip -q BimehIranInstallments.zip -d build_project

          echo "===== Extracted Project ====="
          find build_project -maxdepth 5 -type f | sort

      # -----------------------------
      # 6. پیدا کردن پروژه Android
      # -----------------------------
      - name: Detect Android project
        run: |
          echo "Searching for Android project..."

          if [ -d "build_project/BimehIranInstallments" ]; then
            echo "Project found:"
            echo "build_project/BimehIranInstallments"
          else
            echo "ERROR: Android project directory not found"
            find build_project -maxdepth 3 -type d | sort
            exit 1
          fi

      # -----------------------------
      # 7. Gradle
      # -----------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # -----------------------------
      # 8. بررسی Gradle
      # -----------------------------
      - name: Gradle information
        working-directory: build_project/BimehIranInstallments
        run: |
          gradle --version

      # -----------------------------
      # 9. Clean
      # -----------------------------
      - name: Clean project
        working-directory: build_project/BimehIranInstallments
        run: |
          gradle clean

      # -----------------------------
      # 10. Unit Tests
      # -----------------------------
      - name: Run tests
        working-directory: build_project/BimehIranInstallments
        run: |
          gradle test
        continue-on-error: true

      # -----------------------------
      # 11. Build Debug APK
      # -----------------------------
      - name: Build Debug APK
        working-directory: build_project/BimehIranInstallments
        run: |
          gradle assembleDebug --stacktrace

      # -----------------------------
      # 12. Build Release APK
      # -----------------------------
      - name: Build Release APK
        working-directory: build_project/BimehIranInstallments
        run: |
          gradle assembleRelease --stacktrace
        continue-on-error: true

      # -----------------------------
      # 13. نمایش APK ها
      # -----------------------------
      - name: Find APK files
        run: |
          echo "===== APK FILES ====="
          find build_project -type f -name "*.apk" -print

      # -----------------------------
      # 14. تغییر نام Debug APK
      # -----------------------------
      - name: Prepare Debug APK
        run: |
          mkdir -p artifacts

          DEBUG_APK=$(find build_project -type f \
            -path "*/outputs/apk/debug/*.apk" | head -1)

          if [ -z "$DEBUG_APK" ]; then
            echo "ERROR: Debug APK was not created"
            exit 1
          fi

          cp "$DEBUG_APK" \
            artifacts/BimehIranInstallments-debug.apk

      # -----------------------------
      # 15. آماده‌سازی Release
      # -----------------------------
      - name: Prepare Release APK
        run: |
          RELEASE_APK=$(find build_project -type f \
            -path "*/outputs/apk/release/*.apk" | head -1)

          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" \
              artifacts/BimehIranInstallments-release.apk
          else
            echo "Release APK not available"
          fi

      # -----------------------------
      # 16. Upload Debug APK
      # -----------------------------
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BimehIranInstallments-Debug
          path: artifacts/BimehIranInstallments-debug.apk
          if-no-files-found: error

      # -----------------------------
      # 17. Upload Release APK
      # -----------------------------
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: BimehIranInstallments-Release
          path: artifacts/BimehIranInstallments-release.apk
          if-no-files-found: ignore

      # -----------------------------
      # 18. گزارش نهایی
      # -----------------------------
      - name: Build Summary
        run: |
          echo "======================================"
          echo " Bimeh Iran Installments APK"
          echo " Build completed"
          echo "======================================"

          echo "Generated files:"
          ls -lh artifacts/
